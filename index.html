<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Productive Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f8fafc;
        --surface: #ffffff;
        --surface-alt: #f1f5f9;
        --surface-hover: #e2e8f0;
        --text: #0f172a;
        --text-muted: #64748b;
        --accent: #0f172a;
        --accent-soft: rgba(15, 23, 42, 0.12);
        --accent-shadow: rgba(15, 23, 42, 0.22);
        --danger: #e11d48;
        --danger-soft: rgba(225, 29, 72, 0.14);
        --success: #10b981;
        --border: rgba(15, 23, 42, 0.09);
        --shadow: 0 10px 28px -6px rgba(15, 23, 42, 0.07),
          0 4px 10px -4px rgba(15, 23, 42, 0.04);
        --code-font: "JetBrains Mono", "Fira Code", "SFMono-Regular", ui-monospace,
          Consolas, monospace;
        --button-text: #ffffff;
      }

      body[data-theme="minimal-white"] {
        --bg: #f8fafc;
        --surface: #ffffff;
        --surface-alt: #f1f5f9;
        --surface-hover: #e2e8f0;
        --text: #0f172a;
        --text-muted: #64748b;
        --accent: #0f172a;
        --accent-soft: rgba(15, 23, 42, 0.12);
        --accent-shadow: rgba(15, 23, 42, 0.22);
        --danger: #e11d48;
        --danger-soft: rgba(225, 29, 72, 0.14);
        --border: rgba(15, 23, 42, 0.09);
        --shadow: 0 10px 28px -6px rgba(15, 23, 42, 0.07),
          0 4px 10px -4px rgba(15, 23, 42, 0.04);
        --button-text: #ffffff;
      }

      body[data-theme="soft-pastel"] {
        --bg: #fdf8fa;
        --surface: #fff5f8;
        --surface-alt: #eefcf6;
        --surface-hover: #dff7ec;
        --text: #2d3142;
        --text-muted: #6c728a;
        --accent: #38b2ac;
        --accent-soft: rgba(56, 178, 172, 0.18);
        --accent-shadow: rgba(56, 178, 172, 0.28);
        --danger: #f43f5e;
        --danger-soft: rgba(244, 63, 94, 0.15);
        --border: rgba(45, 49, 66, 0.1);
        --shadow: 0 10px 28px -6px rgba(45, 49, 66, 0.07);
        --button-text: #ffffff;
      }

      body[data-theme="modern-blue-sky"] {
        --bg: #eff6ff;
        --surface: #ffffff;
        --surface-alt: #e0f2fe;
        --surface-hover: #bae6fd;
        --text: #0c2340;
        --text-muted: #476382;
        --accent: #0284c7;
        --accent-soft: rgba(2, 132, 199, 0.16);
        --accent-shadow: rgba(2, 132, 199, 0.28);
        --danger: #e11d48;
        --danger-soft: rgba(225, 29, 72, 0.15);
        --border: rgba(12, 35, 64, 0.1);
        --shadow: 0 10px 28px -6px rgba(2, 132, 199, 0.1);
        --button-text: #ffffff;
      }

      body[data-theme="elegant-gold"] {
        --bg: #fbf7ed;
        --surface: #fffdf7;
        --surface-alt: #f4ebd4;
        --surface-hover: #eadbb8;
        --text: #292524;
        --text-muted: #786a52;
        --accent: #b45309;
        --accent-soft: rgba(180, 83, 9, 0.16);
        --accent-shadow: rgba(180, 83, 9, 0.25);
        --danger: #dc2626;
        --danger-soft: rgba(220, 38, 38, 0.15);
        --border: rgba(41, 37, 36, 0.11);
        --shadow: 0 10px 28px -6px rgba(41, 37, 36, 0.08);
        --button-text: #ffffff;
      }

      body[data-theme="nature-green"] {
        --bg: #f2fbf4;
        --surface: #ffffff;
        --surface-alt: #e3f7e8;
        --surface-hover: #ccefd5;
        --text: #1e3a2f;
        --text-muted: #4d6b5e;
        --accent: #059669;
        --accent-soft: rgba(5, 150, 105, 0.18);
        --accent-shadow: rgba(5, 150, 105, 0.28);
        --danger: #e11d48;
        --danger-soft: rgba(225, 29, 72, 0.15);
        --border: rgba(30, 58, 47, 0.1);
        --shadow: 0 10px 28px -6px rgba(5, 150, 105, 0.09);
        --button-text: #ffffff;
      }

      body[data-theme="classic-dark"] {
        --bg: #0b0d10;
        --surface: #14171c;
        --surface-alt: #1e2229;
        --surface-hover: #282d37;
        --text: #f3f4f6;
        --text-muted: #9ca3af;
        --accent: #f3f4f6;
        --accent-soft: rgba(243, 244, 246, 0.14);
        --accent-shadow: rgba(243, 244, 246, 0.2);
        --danger: #fb7185;
        --danger-soft: rgba(251, 113, 133, 0.2);
        --border: rgba(255, 255, 255, 0.1);
        --shadow: 0 14px 34px -8px rgba(0, 0, 0, 0.65);
        --button-text: #0b0d10;
      }

      body[data-theme="cyber-neon"] {
        --bg: #09090f;
        --surface: #13131f;
        --surface-alt: #1d1d2e;
        --surface-hover: #292940;
        --text: #f1f5f9;
        --text-muted: #94a3b8;
        --accent: #e879f9;
        --accent-soft: rgba(232, 121, 249, 0.22);
        --accent-shadow: rgba(232, 121, 249, 0.35);
        --danger: #fb7185;
        --danger-soft: rgba(251, 113, 133, 0.22);
        --border: rgba(232, 121, 249, 0.18);
        --shadow: 0 14px 34px -8px rgba(0, 0, 0, 0.7);
        --button-text: #09090f;
      }

      body[data-theme="deep-ocean"] {
        --bg: #041527;
        --surface: #0a233f;
        --surface-alt: #103156;
        --surface-hover: #17406e;
        --text: #f0f9ff;
        --text-muted: #93c5fd;
        --accent: #22d3ee;
        --accent-soft: rgba(34, 211, 238, 0.22);
        --accent-shadow: rgba(34, 211, 238, 0.35);
        --danger: #fb7185;
        --danger-soft: rgba(251, 113, 133, 0.22);
        --border: rgba(147, 197, 253, 0.16);
        --shadow: 0 14px 34px -8px rgba(0, 0, 0, 0.65);
        --button-text: #041527;
      }

      body[data-theme="crimson-noir"] {
        --bg: #120e10;
        --surface: #1d1619;
        --surface-alt: #2b1f24;
        --surface-hover: #3a2930;
        --text: #faf5f6;
        --text-muted: #cfaeb6;
        --accent: #f43f5e;
        --accent-soft: rgba(244, 63, 94, 0.24);
        --accent-shadow: rgba(244, 63, 94, 0.36);
        --danger: #fda4af;
        --danger-soft: rgba(253, 164, 175, 0.24);
        --border: rgba(255, 255, 255, 0.11);
        --shadow: 0 14px 34px -8px rgba(0, 0, 0, 0.65);
        --button-text: #ffffff;
      }

      body[data-theme="midnight-purple"] {
        --bg: #0c0817;
        --surface: #17102b;
        --surface-alt: #231940;
        --surface-hover: #302257;
        --text: #f5f3ff;
        --text-muted: #b8aee0;
        --accent: #a855f7;
        --accent-soft: rgba(168, 85, 247, 0.25);
        --accent-shadow: rgba(168, 85, 247, 0.38);
        --danger: #fb7185;
        --danger-soft: rgba(251, 113, 133, 0.24);
        --border: rgba(216, 180, 254, 0.15);
        --shadow: 0 14px 34px -8px rgba(0, 0, 0, 0.65);
        --button-text: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        color-scheme: light;
        transition: background 0.25s ease, color 0.25s ease;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        -webkit-font-smoothing: antialiased;
      }

      body[data-theme-mode="dark"] {
        color-scheme: dark;
      }

      /* Top Header Bar */
      .top-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1rem clamp(1rem, 3vw, 2.5rem);
        background: var(--surface);
        gap: 1rem;
        position: sticky;
        top: 0;
        z-index: 10;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        border-bottom: 1px solid var(--border);
        backdrop-filter: blur(12px);
      }

      .app-brand {
        display: flex;
        align-items: center;
        gap: 0.65rem;
      }

      .app-brand__badge {
        width: 2rem;
        height: 2rem;
        border-radius: 0.6rem;
        background: var(--accent);
        color: var(--button-text);
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 0.95rem;
        box-shadow: 0 4px 12px var(--accent-shadow);
      }

      .app-title {
        margin: 0;
        font-size: clamp(1.15rem, 1.4vw + 0.75rem, 1.55rem);
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .top-bar__actions {
        display: flex;
        gap: 0.65rem;
        align-items: center;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .widget-adder,
      .theme-picker {
        display: flex;
        gap: 0.45rem;
        align-items: center;
        background: var(--surface-alt);
        padding: 0.35rem 0.45rem 0.35rem 0.8rem;
        border-radius: 999px;
        border: 1px solid var(--border);
      }

      .widget-adder__label,
      .theme-picker__label {
        font-size: 0.8rem;
        font-weight: 500;
        color: var(--text-muted);
        white-space: nowrap;
      }

      .widget-adder__select,
      .theme-picker__select {
        -webkit-appearance: none;
        appearance: none;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 999px;
        color: var(--text);
        font-family: inherit;
        font-size: 0.85rem;
        font-weight: 500;
        outline: none;
        padding: 0.35rem 1.85rem 0.35rem 0.8rem;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
        background-image: linear-gradient(45deg, transparent 50%, currentColor 50%),
          linear-gradient(135deg, currentColor 50%, transparent 50%);
        background-position: calc(100% - 0.95rem) 52%, calc(100% - 0.65rem) 52%;
        background-size: 0.3rem 0.3rem;
        background-repeat: no-repeat;
        cursor: pointer;
        color-scheme: inherit;
      }

      .widget-adder__select:hover,
      .theme-picker__select:hover {
        border-color: var(--accent);
      }

      .widget-adder__select:focus-visible,
      .theme-picker__select:focus-visible {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      .widget-adder__select option,
      .theme-picker__select option {
        background: var(--surface);
        color: var(--text);
      }

      .theme-picker__select {
        min-width: 11.5rem;
      }

      .top-bar__reset {
        white-space: nowrap;
      }

      /* Buttons */
      .button {
        border: none;
        background: var(--accent);
        color: var(--button-text, #ffffff);
        padding: 0.45rem 0.95rem;
        border-radius: 999px;
        cursor: pointer;
        font-family: inherit;
        font-size: 0.85rem;
        font-weight: 600;
        transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease,
          background 0.15s ease;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.35rem;
      }

      .button:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: 0 6px 16px var(--accent-shadow);
      }

      .button:active:not(:disabled) {
        transform: translateY(0);
        box-shadow: none;
      }

      .button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .button--ghost {
        background: transparent;
        color: var(--text);
        box-shadow: inset 0 0 0 1px var(--border);
      }

      .button--ghost:hover:not(:disabled) {
        background: var(--surface-alt);
        box-shadow: inset 0 0 0 1px var(--accent);
        color: var(--accent);
      }

      .button--danger {
        background: var(--danger);
        color: #ffffff;
      }

      .button--danger:hover:not(:disabled) {
        box-shadow: 0 6px 16px var(--danger-soft);
      }

      /* Main Layout */
      main {
        flex: 1;
        padding: 1.5rem clamp(1rem, 3vw, 2.5rem) 2.5rem;
        max-width: 1520px;
        width: 100%;
        margin: 0 auto;
      }

      .dashboard {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(260px, 390px);
        column-gap: clamp(0.75rem, 2vw, 1.5rem);
        align-items: start;
        min-height: 0;
      }

      .dashboard__primary {
        display: grid;
        gap: 1.25rem;
        align-content: flex-start;
        min-width: 0;
      }

      .dashboard__primary > * {
        min-width: 0;
      }

      .dashboard__aside {
        display: grid;
        align-content: flex-start;
        gap: 1.15rem;
        min-width: 0;
      }

      .note-column {
        display: grid;
        gap: 1.25rem;
        align-content: flex-start;
      }

      .utility-stack {
        display: grid;
        gap: 1.15rem;
        align-content: flex-start;
      }

      .clipboard-region {
        display: grid;
        gap: 1rem;
        align-content: flex-start;
      }

      /* Widget Cards */
      .widget {
        background: var(--surface);
        border-radius: 1.15rem;
        box-shadow: var(--shadow);
        border: 1px solid var(--border);
        min-height: 200px;
        display: flex;
        flex-direction: column;
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        position: relative;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        overflow: hidden;
      }

      .widget--note {
        min-height: 360px;
        min-width: 0;
      }

      .widget--timer {
        min-height: 220px;
      }

      .widget--calculator {
        min-width: 0;
      }

      .widget.dragging {
        opacity: 0.55;
        transform: scale(0.99);
        box-shadow: 0 18px 40px var(--accent-shadow);
        border-color: var(--accent);
      }

      .widget--resizing {
        user-select: none;
      }

      .widget__header {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.7rem 1rem;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
        cursor: grab;
        user-select: none;
      }

      .widget__header:active {
        cursor: grabbing;
      }

      .widget--note .widget__header,
      .widget--note .widget__header:active {
        cursor: default;
      }

      .widget--note .widget__handle {
        display: none;
      }

      .widget__handle {
        font-size: 1rem;
        color: var(--text-muted);
        opacity: 0.7;
        letter-spacing: -1px;
      }

      .widget__title {
        flex: 1;
        margin: 0;
        font-size: 0.95rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .widget__controls {
        display: flex;
        align-items: center;
        gap: 0.35rem;
      }

      .widget__icon-btn {
        width: 1.85rem;
        height: 1.85rem;
        border-radius: 999px;
        display: grid;
        place-items: center;
        font-size: 0.95rem;
        padding: 0;
        background: transparent;
        color: var(--text-muted);
        border: 1px solid transparent;
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .widget__icon-btn:hover {
        background: var(--surface-alt);
        color: var(--text);
        border-color: var(--border);
      }

      .widget__remove {
        width: 1.85rem;
        height: 1.85rem;
        display: grid;
        place-items: center;
        font-size: 1.15rem;
        font-weight: 500;
        line-height: 1;
        padding: 0;
        color: var(--text-muted);
      }

      .widget__remove:hover:not(:disabled) {
        color: var(--danger);
        box-shadow: inset 0 0 0 1px var(--danger);
      }

      .widget__body {
        padding: 1rem 1.1rem 1.35rem;
        display: flex;
        flex-direction: column;
        gap: 0.85rem;
        flex: 1;
        min-height: 0;
        overflow: auto;
      }

      /* Note Pad */
      .note-content {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        min-height: 0;
        height: 100%;
        flex: 1;
      }

      textarea.note-area {
        width: 100%;
        min-height: 240px;
        flex: 1;
        resize: none;
        font-family: inherit;
        font-size: 0.98rem;
        line-height: 1.65;
        padding: 1rem 1.1rem;
        border-radius: 0.85rem;
        border: 1px solid var(--border);
        background: var(--surface-alt);
        color: inherit;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      textarea.note-area:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      /* Clipboard Panel */
      .clipboard-panel {
        background: var(--surface);
        border-radius: 1.15rem;
        border: 1px solid var(--border);
        padding: 1.1rem;
        display: grid;
        gap: 0.75rem;
        box-shadow: var(--shadow);
      }

      .clipboard-panel__header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
      }

      .clipboard-panel__title {
        margin: 0;
        font-size: 0.95rem;
        font-weight: 600;
      }

      .clipboard-panel__status {
        margin: 0;
        font-size: 0.8rem;
        color: var(--text-muted);
      }

      .clipboard-panel__composer {
        display: flex;
        gap: 0.5rem;
        align-items: stretch;
      }

      .clipboard-panel__input {
        flex: 1;
        min-height: 2.5rem;
        padding: 0.55rem 0.75rem;
        border-radius: 0.75rem;
        border: 1px solid var(--border);
        background: var(--surface-alt);
        color: inherit;
        font-family: var(--code-font);
        font-size: 0.82rem;
        resize: vertical;
        line-height: 1.4;
      }

      .clipboard-panel__input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      .clipboard-panel__action {
        white-space: nowrap;
      }

      .clipboard-panel__list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 0.5rem;
        max-height: 220px;
        overflow-y: auto;
      }

      .clipboard-panel__empty {
        background: var(--surface-alt);
        border-radius: 0.85rem;
        border: 1px dashed var(--border);
        padding: 0.9rem;
        color: var(--text-muted);
        font-size: 0.85rem;
        text-align: center;
      }

      .clipboard-item {
        background: var(--surface-alt);
        border-radius: 0.85rem;
        border: 1px solid var(--border);
        padding: 0.6rem 0.75rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
      }

      .clipboard-item__text {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        font-family: var(--code-font);
        font-size: 0.82rem;
        line-height: 1.35;
        max-height: 3.8rem;
        overflow: auto;
        flex: 1;
      }

      .clipboard-item__actions {
        display: flex;
        flex-wrap: nowrap;
        gap: 0.35rem;
        flex-shrink: 0;
      }

      .clipboard-item__button {
        padding: 0.3rem 0.65rem;
        font-size: 0.78rem;
      }

      .clipboard-item__button--danger {
        color: var(--danger);
        box-shadow: inset 0 0 0 1px var(--danger-soft);
      }

      .clipboard-item__button--danger:hover:not(:disabled) {
        color: #fff;
        background: var(--danger);
        box-shadow: 0 4px 12px var(--danger-soft);
      }

      /* =========================================
         TIMER WIDGET (Redesigned & Clean)
         ========================================= */
      .timer {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        width: 100%;
      }

      .timer-presets {
        display: flex;
        justify-content: center;
        gap: 0.35rem;
        flex-wrap: wrap;
      }

      .timer-preset-btn {
        background: var(--surface-alt);
        border: 1px solid var(--border);
        color: var(--text-muted);
        border-radius: 999px;
        padding: 0.25rem 0.65rem;
        font-size: 0.75rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .timer-preset-btn:hover {
        border-color: var(--accent);
        color: var(--text);
        background: var(--surface-hover);
      }

      .timer-preset-btn.is-active {
        background: var(--accent-soft);
        border-color: var(--accent);
        color: var(--accent);
      }

      .timer-hero {
        background: var(--surface-alt);
        border: 1px solid var(--border);
        border-radius: 1rem;
        padding: 0.85rem 1rem 0.75rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
        position: relative;
        overflow: hidden;
      }

      .timer-display {
        font-family: var(--code-font);
        font-size: 2.35rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
        color: var(--text);
      }

      .timer-progress {
        width: 100%;
        height: 5px;
        background: var(--border);
        border-radius: 999px;
        overflow: hidden;
      }

      .timer-progress__bar {
        height: 100%;
        width: 100%;
        background: var(--accent);
        border-radius: 999px;
        transition: width 0.35s linear, background-color 0.2s ease;
      }

      .timer-inputs {

      .calc-btn {

      /* Subtle Bottom Vertical Resizer */
      .widget__resizer {

      }
    </style>
